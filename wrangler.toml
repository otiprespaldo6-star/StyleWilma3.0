# Cloudflare Workers & Pages Configuration
# Stack: Cloudflare Pages + Workers + D1 + KV + R2 + Workers AI

name = "styled-by-wilma-api"
main = "workers/index.ts"
compatibility_date = "2026-02-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
APP_NAME = "Styled By Wilma"
FRONTEND_URL = "https://styledbywilma.com"
MAX_REQUESTS_PER_MINUTE = "60"

# 1. D1 Database (SQL) - 5 GB, 5M reads/day (Free Tier 2026)
[[d1_databases]]
binding = "DB"
database_name = "styled_by_wilma_db"
database_id = "d1-styled-by-wilma-prod-id"

# 2. KV Namespace (Cache & Rate Limiting) - 100k reads/day, 1 GB (Free Tier 2026)
[[kv_namespaces]]
binding = "CACHE_KV"
id = "kv_cache_rate_limit_id"

# 3. R2 Bucket (Files & Images) - 10 GB, Zero-egress fee (Free Tier 2026)
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "styled-by-wilma-assets"

# 4. Workers AI (Free Tier Models) - 10,000 neurons/day
[ai]
binding = "AI"

# Secrets required in wrangler secret:
# - TOKEN_ENCRYPTION_KEY (AES-GCM 256-bit key in base64)
# - META_APP_SECRET (For X-Hub-Signature-256 validation)
# - FIREBASE_SERVICE_ACCOUNT (JSON string for firebase-admin custom claims)

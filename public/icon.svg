<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Deep Luxury Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1416"/>
      <stop offset="50%" stop-color="#2D121B"/>
      <stop offset="100%" stop-color="#140D10"/>
    </linearGradient>

    <!-- Rose-Gold / Champagne Gradients for Haute Couture W -->
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="35%" stop-color="#FB7185"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#F43F5E" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Delicate chromatic circular ring representing the 12 color seasons -->
  <circle cx="256" cy="256" r="195" stroke="url(#goldAccent)" stroke-width="2" stroke-dasharray="8 8" opacity="0.3"/>
  <circle cx="256" cy="256" r="175" stroke="#FFFFFF" stroke-width="1" opacity="0.1"/>

  <!-- Four seasonal color accent jewels -->
  <circle cx="256" cy="62" r="8" fill="#F43F5E"/> <!-- Spring Warm Light -->
  <circle cx="450" cy="256" r="8" fill="#0EA5E9"/> <!-- Summer Cool Soft -->
  <circle cx="256" cy="450" r="8" fill="#D97706"/> <!-- Autumn Warm Deep -->
  <circle cx="62" cy="256" r="8" fill="#8B5CF6"/> <!-- Winter Cool Clear -->

  <!-- Central "W" Stylized Haute Couture Monogram -->
  <g filter="url(#glow)">
    <!-- Main Left-to-Center Curves of "W" -->
    <path
      d="M120 160 C135 220 165 330 205 385 C213 397 227 397 235 385 C250 355 265 270 275 220"
      stroke="url(#roseGold)"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Center-to-Right Curves of "W" -->
    <path
      d="M275 220 C285 270 300 355 315 385 C323 397 337 397 345 385 C385 330 415 220 430 160"
      stroke="url(#roseGold)"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Stylist Couture Sparkle Star at Top Center -->
    <path
      d="M275 110 L283 138 L311 146 L283 154 L275 182 L267 154 L239 146 L267 138 Z"
      fill="url(#goldAccent)"
    />

    <!-- Accent Gems at stroke tops -->
    <circle cx="120" cy="155" r="12" fill="#F43F5E"/>
    <circle cx="430" cy="155" r="12" fill="#F59E0B"/>
    <circle cx="275" cy="146" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Sparkling Micro-Stars -->
  <path d="M390 100 L394 114 L408 118 L394 122 L390 136 L386 122 L372 118 L386 114 Z" fill="#FDE68A" opacity="0.8"/>
  <path d="M120 400 L123 411 L134 414 L123 417 L120 428 L117 417 L106 414 L117 411 Z" fill="#FB7185" opacity="0.8"/>
</svg>
